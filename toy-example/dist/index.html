<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCAWS Toy Frontend</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Cloud Computing and AWS</h1>
    <p class="subtitle">Assignment 1 Toy Static Site</p>

    <section class="card">
      <h2>Status</h2>
      <p id="status">Checking page load...</p>
    </section>

    <section class="card">
      <h2>Request Counter (Client Side)</h2>
      <button id="incrementBtn" type="button">Increment</button>
      <p id="counterText">0</p>
    </section>

    <section class="card">
      <h2>Assignment Checklist</h2>
      <ul>
        <li>Static website hosting enabled</li>
        <li>Bucket policy applied</li>
        <li>Versioning enabled</li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
